# Render Blueprint: one Web Service runs the FastAPI backend, which also serves the prebuilt
# React site in frontend/dist (so no separate static site or Node build is needed).
services:
  - type: web
    name: hopecompass
    runtime: python
    plan: free                     # free instances sleep after ~15 min idle (first visit then takes ~1 min)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PORTKEY_API_KEY       # paste your key in Render's dashboard; never commit it
        sync: false
